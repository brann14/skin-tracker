<!doctype html>
<html lang="en">

<head>
    <title>access denied</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="poppins bg-black text-white min-h-screen overflow-hidden">
    <div class="bg"></div>

    {% include "nav.html" %}

    <!-- denied card -->
    <main class="page relative z-10 flex items-center justify-center px-4">
        <div class="card rise w-full max-w-md px-9 py-10 text-center">
            <div class="denied-icon mx-auto mb-5">
                <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 8v5"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>
            </div>
            <h1 class="text-3xl font-semibold">access denied</h1>
            <p class="mt-3 text-sm text-neutral-400">this login looks like an alt of an account thats already signed in from here, so it got blocked</p>
            <p class="mt-3 text-sm text-neutral-400">if that isnt the case, open a ticket and it can be looked at</p>

            <a href="{{ url_for('main') }}" class="back-btn block mt-7 py-3.5 rounded-lg font-medium">back to home</a>
        </div>
    </main>
</body>

</html>
