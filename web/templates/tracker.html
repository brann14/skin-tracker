<!doctype html>
<html lang="en">

<head>
    <title>tracker</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tracker.css') }}">
</head>

<body class="poppins bg-black text-white min-h-screen">
    <div class="bg"></div>

    {% include "nav.html" %}

    <main class="relative z-10 px-6 md:px-12 pb-20">
        <div class="max-w-3xl mx-auto">

            <!-- header -->
            <div class="rise flex items-end justify-between gap-4 mt-4">
                <div>
                    <h1 class="text-3xl font-semibold">your skins</h1>
                    <p class="mt-1 text-sm text-neutral-400">you get a dm when one drops low enough to buy or climbs high enough to sell</p>
                </div>
                <span id="tracked-count" class="count shrink-0">0 / 5</span>
            </div>

            <!-- search, the dropdown stays hidden until there are results -->
            <div class="rise rise-1 search-wrap mt-7">
                <svg class="search-icon w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <input id="skin-search" class="search" type="text" placeholder="search for a skin" autocomplete="off">
                <ul id="search-results" class="results" hidden></ul>
            </div>

            <!-- the cards get put in here -->
            <div id="tracked-grid" class="rise rise-2 grid gap-4 mt-6"></div>

            <!-- shown while the grid is empty -->
            <p id="empty-state" class="rise rise-2 empty-state">nothing tracked yet, search for a skin above</p>

        </div>
    </main>

    <!-- one row in the search dropdown -->
    <template id="result-row">
        <li class="result">
            <img class="result-thumb" src="" alt="">
            <div class="min-w-0">
                <p class="result-name truncate"></p>
                <p class="result-wear text-xs text-neutral-500"></p>
            </div>
            <button class="add-btn" type="button">track</button>
        </li>
    </template>

    <!-- one tracked skin -->
    <template id="skin-card">
        <div class="card skin-card">
            <div class="flex items-center gap-4">
                <img class="skin-thumb" src="" alt="">
                <div class="min-w-0 flex-1">
                    <p class="skin-name truncate font-medium"></p>
                    <p class="skin-wear text-xs text-neutral-500"></p>
                </div>
                <div class="text-right shrink-0">
                    <p class="skin-price font-semibold"></p>
                    <p class="text-xs text-neutral-500">market price</p>
                </div>
            </div>

            <div class="flex items-end gap-3 mt-5">
                <label class="flex-1">
                    <span class="field-label">buy below</span>
                    <input class="buy-below field" type="number" min="0" step="0.01" placeholder="-">
                </label>
                <label class="flex-1">
                    <span class="field-label">sell above</span>
                    <input class="sell-above field" type="number" min="0" step="0.01" placeholder="-">
                </label>
                <button class="save-btn" type="button">save</button>
                <button class="remove-btn" type="button" title="untrack">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
                </button>
            </div>
        </div>
    </template>
</body>

</html>
